<svg viewBox="0 0 1060 860" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#2b2d42"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9a6a00"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#2e7d5b"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#2f5bb7"/></marker>
  </defs>
  <rect x="0" y="0" width="1060" height="860" fill="#ffffff"/>
  <text x="40" y="42" font-size="23" font-weight="700" fill="#1a1a2e">Cerberus &#8212; Human-Owned Delegation for Agents That Act on Production</text>
  <text x="40" y="66" font-size="13.5" fill="#6c6f80">The person owns the AI Passport and delegates a scoped, revocable Pass. The gate verifies the delegation before any irreversible action.</text>

  <rect x="30" y="86" width="1000" height="92" rx="10" fill="#eef4ff" stroke="#c9d8f2"/>
  <text x="46" y="108" font-size="12" font-weight="700" fill="#2f5bb7" letter-spacing="1.5">OWNER &amp; CONSENT PLANE</text>
  <rect x="70" y="118" width="300" height="50" rx="8" fill="#ffffff" stroke="#5c7fd6"/>
  <text x="220" y="139" font-size="13" font-weight="700" fill="#2b2d42" text-anchor="middle">Maya &#8212; owns her AI Passport</text>
  <text x="220" y="157" font-size="11" fill="#6c6f80" text-anchor="middle">NetOps. Identity + operational context</text>
  <rect x="410" y="118" width="290" height="50" rx="8" fill="#ffffff" stroke="#5c7fd6"/>
  <text x="555" y="139" font-size="13" font-weight="700" fill="#2b2d42" text-anchor="middle">Standing delegation envelope</text>
  <text x="555" y="157" font-size="11" fill="#6c6f80" text-anchor="middle">"drain racks in my window, 30-min leases"</text>
  <rect x="740" y="118" width="250" height="50" rx="8" fill="#ffffff" stroke="#2e7d5b"/>
  <text x="865" y="139" font-size="13" font-weight="700" fill="#2e7d5b" text-anchor="middle">Receipts + revoke</text>
  <text x="865" y="157" font-size="11" fill="#6c6f80" text-anchor="middle">owner sees every action, revokes anytime</text>

  <rect x="30" y="192" width="1000" height="86" rx="10" fill="#f5f3ff" stroke="#d9d2f2"/>
  <text x="46" y="214" font-size="12" font-weight="700" fill="#5b4b9e" letter-spacing="1.5">INTENT PLANE</text>
  <rect x="150" y="224" width="330" height="46" rx="8" fill="#ffffff" stroke="#8a7bc8"/>
  <text x="315" y="244" font-size="13" font-weight="600" fill="#2b2d42" text-anchor="middle">Planner Agent (AVATAR)</text>
  <text x="315" y="261" font-size="11" fill="#6c6f80" text-anchor="middle">"drain rack 4" &#8594; change plan + Pass request</text>
  <rect x="580" y="224" width="330" height="46" rx="8" fill="#ffffff" stroke="#8a7bc8"/>
  <text x="745" y="244" font-size="13" font-weight="600" fill="#2b2d42" text-anchor="middle">Pass request</text>
  <text x="745" y="261" font-size="11" fill="#6c6f80" text-anchor="middle">permission, target, purpose, plan hash</text>
  <line x1="480" y1="247" x2="576" y2="247" stroke="#2b2d42" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="294" width="1000" height="176" rx="10" fill="#fff9ec" stroke="#f0dfb0"/>
  <text x="46" y="316" font-size="12" font-weight="700" fill="#9a6a00" letter-spacing="1.5">AUTHORIZATION PLANE &#183; AI PASSPORT (USER-OWNED)</text>
  <rect x="70" y="332" width="215" height="122" rx="8" fill="#ffffff" stroke="#c9a227"/>
  <text x="177" y="356" font-size="13" font-weight="700" fill="#7a5300" text-anchor="middle">AI Passport</text>
  <text x="177" y="376" font-size="11" fill="#6c6f80" text-anchor="middle">Owned by Maya, not the</text>
  <text x="177" y="392" font-size="11" fill="#6c6f80" text-anchor="middle">platform. Issues a narrow,</text>
  <text x="177" y="408" font-size="11" fill="#6c6f80" text-anchor="middle">single-use delegated Pass</text>
  <text x="177" y="424" font-size="11" fill="#6c6f80" text-anchor="middle">inside her envelope.</text>
  <text x="177" y="443" font-size="11" font-style="italic" fill="#9a6a00" text-anchor="middle">The person controls access</text>
  <rect x="420" y="322" width="220" height="140" rx="8" fill="#fdf3d6" stroke="#9a6a00" stroke-width="2.2"/>
  <text x="530" y="346" font-size="15" font-weight="800" fill="#7a5300" text-anchor="middle">&#9739; PORTCULLIS GATE</text>
  <text x="530" y="367" font-size="11" fill="#5a4a2a" text-anchor="middle">Verifies the delegated Pass</text>
  <text x="530" y="384" font-size="11" fill="#5a4a2a" text-anchor="middle">1&#183; owner-delegated + in scope?</text>
  <text x="530" y="400" font-size="11" fill="#5a4a2a" text-anchor="middle">2&#183; bound to this agent+gateway?</text>
  <text x="530" y="416" font-size="11" fill="#5a4a2a" text-anchor="middle">3&#183; authoritative state + evidence?</text>
  <text x="530" y="432" font-size="11" fill="#5a4a2a" text-anchor="middle">4&#183; nonce fresh, not revoked?</text>
  <text x="530" y="451" font-size="10.5" font-style="italic" fill="#9a6a00" text-anchor="middle">deterministic, boring, auditable</text>
  <rect x="775" y="332" width="215" height="122" rx="8" fill="#ffffff" stroke="#c0392b"/>
  <text x="882" y="356" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Revocation (owner-held)</text>
  <text x="882" y="376" font-size="11" fill="#6c6f80" text-anchor="middle">Checked at execution</text>
  <text x="882" y="392" font-size="11" fill="#6c6f80" text-anchor="middle">Blocks new execution;</text>
  <text x="882" y="408" font-size="11" fill="#6c6f80" text-anchor="middle">cancels leased/long-running</text>
  <text x="882" y="424" font-size="11" fill="#6c6f80" text-anchor="middle">ops the controller supports</text>
  <text x="882" y="443" font-size="11" font-style="italic" fill="#c0392b" text-anchor="middle">Maya revokes anytime</text>
  <line x1="745" y1="270" x2="745" y2="300" stroke="#2b2d42" stroke-width="1.6"/>
  <path d="M745,290 C745,312 177,312 177,330" fill="none" stroke="#2b2d42" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="285" y1="393" x2="416" y2="393" stroke="#9a6a00" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <text x="350" y="385" font-size="10" fill="#9a6a00" text-anchor="middle">delegated Pass</text>
  <line x1="640" y1="393" x2="770" y2="393" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <text x="705" y="385" font-size="10" fill="#c0392b" text-anchor="middle">check status</text>
  <path d="M150,143 C120,143 120,250 120,332" fill="none" stroke="#2f5bb7" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrowBlue)"/>
  <path d="M940,332 C960,300 960,200 900,170" fill="none" stroke="#2e7d5b" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrowGreen)"/>
  <text x="984" y="250" font-size="9.5" fill="#2e7d5b" transform="rotate(-90 972 250)">receipt after every action</text>

  <rect x="30" y="486" width="1000" height="86" rx="10" fill="#eef7f7" stroke="#c3e0e0"/>
  <text x="46" y="508" font-size="12" font-weight="700" fill="#1f6f6f" letter-spacing="1.5">CONTROL PLANE</text>
  <rect x="360" y="514" width="340" height="48" rx="8" fill="#ffffff" stroke="#2a8c8c"/>
  <text x="530" y="534" font-size="14" font-weight="700" fill="#1f6f6f" text-anchor="middle">DSX Air / SONiC Orchestrator</text>
  <text x="530" y="552" font-size="10.5" fill="#6c6f80" text-anchor="middle">compiles plan &#8594; validated switch config; source of authoritative op-state</text>
  <line x1="530" y1="462" x2="530" y2="512" stroke="#2e7d5b" stroke-width="2.4" marker-end="url(#arrowGreen)"/>
  <rect x="540" y="474" width="86" height="22" rx="11" fill="#e3f5ea" stroke="#2e7d5b"/>
  <text x="583" y="489" font-size="11" font-weight="700" fill="#2e7d5b" text-anchor="middle">PASS &#10003;</text>
  <line x1="430" y1="462" x2="430" y2="480" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="330" y="480" width="100" height="22" rx="11" fill="#fbe4e1" stroke="#c0392b"/>
  <text x="380" y="495" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">DENY &#8594; log</text>

  <rect x="30" y="588" width="1000" height="196" rx="10" fill="#f2f4f8" stroke="#d3dae6"/>
  <text x="46" y="610" font-size="12" font-weight="700" fill="#3b4a63" letter-spacing="1.5">DATA PLANE &#183; LEAF-SPINE (CLOS) FABRIC</text>
  <rect x="330" y="624" width="150" height="38" rx="6" fill="#3b4a63"/>
  <text x="405" y="648" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SPINE 1</text>
  <rect x="590" y="624" width="150" height="38" rx="6" fill="#3b4a63"/>
  <text x="665" y="648" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SPINE 2</text>
  <g fill="#5a6b8c">
    <rect x="90" y="702" width="150" height="36" rx="6"/>
    <rect x="320" y="702" width="150" height="36" rx="6"/>
    <rect x="560" y="702" width="150" height="36" rx="6"/>
    <rect x="800" y="702" width="150" height="36" rx="6"/>
  </g>
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="165" y="725">LEAF 1</text><text x="395" y="725">LEAF 2</text><text x="635" y="725">LEAF 3 (rack 4)</text><text x="875" y="725">LEAF 4</text>
  </g>
  <g stroke="#9aa7be" stroke-width="1.3">
    <line x1="165" y1="702" x2="360" y2="662"/><line x1="165" y1="702" x2="620" y2="662"/>
    <line x1="395" y1="702" x2="380" y2="662"/><line x1="395" y1="702" x2="640" y2="662"/>
    <line x1="635" y1="702" x2="430" y2="662"/><line x1="635" y1="702" x2="665" y2="662"/>
    <line x1="875" y1="702" x2="450" y2="662"/><line x1="875" y1="702" x2="700" y2="662"/>
  </g>
  <line x1="500" y1="562" x2="430" y2="622" stroke="#2a8c8c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="560" y1="562" x2="640" y2="622" stroke="#2a8c8c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1014" y="611" font-size="10.5" fill="#2e7d5b" text-anchor="end" font-style="italic">sFlow MCP = live evidence, not the sole oracle</text>
  <path d="M875,738 C875,802 40,802 40,393 C40,393 46,393 66,393" fill="none" stroke="#2e7d5b" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <text x="520" y="812" font-size="10" fill="#2e7d5b" text-anchor="middle">live evidence + authoritative controller state feed the gate's step-3 check</text>
</svg>
