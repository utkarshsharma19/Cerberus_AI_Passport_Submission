<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 z" fill="#2b2d42"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="340" fill="#ffffff"/>

  <!-- PERSON -->
  <rect x="30" y="120" width="150" height="70" rx="10" fill="#eef4ff" stroke="#5c7fd6" stroke-width="1.8"/>
  <text x="105" y="150" font-size="17" font-weight="800" fill="#2f5bb7" text-anchor="middle">PERSON</text>
  <text x="105" y="172" font-size="12" fill="#6c6f80" text-anchor="middle">owns the Passport</text>

  <!-- AI PASSPORT -->
  <rect x="250" y="110" width="180" height="90" rx="10" fill="#fff9ec" stroke="#c9a227" stroke-width="1.8"/>
  <text x="340" y="140" font-size="17" font-weight="800" fill="#7a5300" text-anchor="middle">AI PASSPORT</text>
  <text x="340" y="162" font-size="12" fill="#6c6f80" text-anchor="middle">delegates a scoped Pass,</text>
  <text x="340" y="179" font-size="12" fill="#6c6f80" text-anchor="middle">capped by enterprise rights</text>

  <!-- intersection annotation -->
  <text x="340" y="96" font-size="12" font-weight="700" fill="#9a6a00" text-anchor="middle">enterprise caps what may be delegated to an agent</text>

  <!-- AGENT -->
  <rect x="500" y="120" width="150" height="70" rx="10" fill="#f5f3ff" stroke="#8a7bc8" stroke-width="1.8"/>
  <text x="575" y="150" font-size="17" font-weight="800" fill="#5b4b9e" text-anchor="middle">AGENT</text>
  <text x="575" y="172" font-size="12" fill="#6c6f80" text-anchor="middle">proposes an action</text>

  <!-- PORTCULLIS -->
  <rect x="720" y="110" width="180" height="90" rx="10" fill="#fdf3d6" stroke="#9a6a00" stroke-width="2.4"/>
  <text x="810" y="140" font-size="17" font-weight="800" fill="#7a5300" text-anchor="middle">&#9739; PORTCULLIS</text>
  <text x="810" y="162" font-size="12" fill="#5a4a2a" text-anchor="middle">verifies the Pass,</text>
  <text x="810" y="179" font-size="12" fill="#5a4a2a" text-anchor="middle">then and only then executes</text>

  <!-- PRODUCTION -->
  <rect x="970" y="120" width="200" height="70" rx="10" fill="#f2f4f8" stroke="#3b4a63" stroke-width="1.8"/>
  <text x="1070" y="150" font-size="17" font-weight="800" fill="#3b4a63" text-anchor="middle">PRODUCTION</text>
  <text x="1070" y="172" font-size="12" fill="#6c6f80" text-anchor="middle">the fabric changes</text>

  <!-- arrows -->
  <g stroke="#2b2d42" stroke-width="2" marker-end="url(#h)">
    <line x1="180" y1="155" x2="246" y2="155"/>
    <line x1="430" y1="155" x2="496" y2="155"/>
    <line x1="650" y1="155" x2="716" y2="155"/>
    <line x1="900" y1="155" x2="966" y2="155"/>
  </g>
  <text x="213" y="146" font-size="11" fill="#6c6f80" text-anchor="middle">delegates</text>
  <text x="463" y="146" font-size="11" fill="#6c6f80" text-anchor="middle">Pass</text>
  <text x="683" y="146" font-size="11" fill="#6c6f80" text-anchor="middle">presents</text>
  <text x="933" y="146" font-size="11" fill="#6c6f80" text-anchor="middle">verify</text>

  <!-- revoke rail -->
  <path d="M1070,192 C1070,262 340,262 340,204" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#h)"/>
  <text x="705" y="284" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">owner sees a receipt and can revoke at any time</text>

  <text x="600" y="314" font-size="14.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">The enterprise sets the ceiling. The person delegates. The agent proposes. The gate enforces.</text>
</svg>
